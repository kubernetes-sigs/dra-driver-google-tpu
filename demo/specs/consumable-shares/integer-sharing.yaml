# Capped sharing: at most N claims may be allocated this node's TPU chips.
#
# Run the driver with:
#   --feature-gates ConsumableShares=true --consumable-shares 2
#
# Each chip publishes a `shares` capacity of N with a request policy of
# default=1, min=1, max=N, step=1. A claim that does not ask for `shares`
# consumes exactly one, so the replica count below is the number of sharers.
# Scale past N and the extra pods stay Pending, which is the intended cap.
---
apiVersion: v1
kind: Namespace
metadata:
  name: tpu-share

---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: tpu-share
  name: shared-tpus
spec:
  spec:
    devices:
      requests:
      - name: tpus
        exactly:
          deviceClassName: tpu.google.com
          allocationMode: All
          # Optional: consume more than one share, e.g. to reserve half of a
          # --consumable-shares=4 node for a single claim.
          # capacity:
          #   requests:
          #     shares: "2"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: tpu-share
  name: capped-sharing
  labels:
    app: capped-sharing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capped-sharing
  template:
    metadata:
      labels:
        app: capped-sharing
    spec:
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: ctr
        image: busybox:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Pod: $HOSTNAME"
          echo "Visible TPU devices:"
          ls /dev/ | grep -E 'accel|vfio' || echo "  none"
          echo "Sleeping indefinitely..."
          sleep infinity
        resources:
          claims:
          - name: tpus
      resourceClaims:
      - name: tpus
        resourceClaimTemplateName: shared-tpus
