# Same as tpu-test.yaml, but attaches an opaque TpuConfig to the claim that
# raises libtpu log filtering to ERROR (TPU_MIN_LOG_LEVEL/TPU_STDERR_LOG_LEVEL).
# Levels: 0=INFO, 1=WARNING, 2=ERROR, 3=FATAL.

---
apiVersion: v1
kind: Namespace
metadata:
  name: tpu-test

---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: tpu-test
  name: all-tpus
spec:
  spec:
    devices:
      requests:
      - name: tpus
        exactly:
          deviceClassName: tpu.google.com
          allocationMode: All
      config:
      - requests: ["tpus"]
        opaque:
          driver: tpu.google.com
          parameters:
            apiVersion: tpu.resource.google.com/v1alpha1
            kind: TpuConfig
            logging:
              level: 2

---
apiVersion: v1
kind: Pod
metadata:
  namespace: tpu-test
  name: tpu-pod0
  labels:
    app: pod
spec:
  tolerations:
  - key: "google.com/tpu"
    operator: "Exists"
    effect: "NoSchedule"
  containers:
  - name: ctr0
    image: busybox:latest
    command:
        - /bin/sh
        - -c
        - |
          echo "TPU log level environment variables:"
          env | grep TPU_.*_LOG_LEVEL
          echo "Sleeping indefinitely..."
          sleep infinity
    resources:
      claims:
      - name: tpu
  resourceClaims:
  - name: tpu
    resourceClaimTemplateName: all-tpus
