kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  # Allows requesting TPUs via classic extended resources (KEP-5004); see
  # demo/specs/tpu-extended-resource.yaml. Alpha (off by default) until
  # Kubernetes 1.37.
  DRAExtendedResource: true
nodes:
- role: control-plane
- role: worker
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "cloud.google.com/gke-tpu-accelerator=tpu-v4-podslice,cloud.google.com/gke-tpu-topology=2x2x1,cloud.google.com/gke-accelerator-count=4,cloud.google.com/gke-tpu-dra-driver=true"