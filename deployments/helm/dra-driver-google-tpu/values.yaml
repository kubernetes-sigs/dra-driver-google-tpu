# Default values for dra-driver-google-tpu.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

allowDefaultNamespace: false

deviceClasses: ["tpu"]

# Feature gates for the kubelet plugin, as a map of gate name to bool.
# e.g. featureGates: { ConsumableShares: true }
featureGates: {}

# How many ResourceClaims may share the TPU chips on a node:
#   "disabled"  - a single claim holds the chips (default)
#   "unlimited" - any number of claims may share them
#   "<N>"       - at most N claims may share them
#
# Requires featureGates.ConsumableShares=true and a cluster with the
# DRAConsumableCapacity feature gate enabled on the API server and scheduler.
# Only single-host TPU nodes can share; on a multi-host slice this is ignored.
#
# Sharing lets claims co-schedule and mount the same chips. It does NOT let two
# processes drive a chip at the same time: the TPU runtime takes an exclusive
# lock when a process opens a chip.
consumableShares: "disabled"

imagePullSecrets: []
image:
  repository: registry.k8s.io/dra-driver-google/dra-driver-google-tpu
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

controller:
  priorityClassName: "system-node-critical"
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  affinity: {}
  containers:
    controller:
      securityContext: {}
      resources: {}

kubeletPlugin:
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  # TPUs are usually tainted so that only TPU workloads land on them.
  tolerations:
  - key: google.com/tpu
    operator: Exists
    effect: NoSchedule
  # By default the plugin runs on every node, detects whether the node has a TPU
  # and stays idle when it has none, so no platform specific label is needed.
  # Restrict it to a subset of the nodes by setting an affinity, for example on
  # GKE:
  #
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: cloud.google.com/gke-tpu-accelerator
  #           operator: Exists
  affinity: {}
  # Description of the TPU attached to the node. The number of chips and, for a
  # single host TPU, the topology are probed from the host. The accelerator type
  # is read from the host tpu-env file, the cloud metadata server or the node
  # labels. Set the properties the platform does not provide.
  #
  # These values are the same for every node the DaemonSet runs on, so they
  # only work for a cluster where every node has the same TPU. On a
  # heterogeneous cluster leave them empty and set the accelerator type per
  # node instead, e.g. with the tpu-env file or a node label.
  tpu:
    accelerator: ""
    chipCount: ""
    topology: ""
    iciResiliency: ""
    # Path on the host of the tpu-env file written by the Cloud TPU runtime.
    envFilePath: /etc/tpu/tpu-env
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  containers:
    init:
      securityContext: {}
      resources: {}
    plugin:
      securityContext:
        privileged: true
      resources: {}
    # Cloud TPU specific helpers. They rely on images that are only published
    # for Google Cloud, disable them when running on other platforms.
    networkOptimizer:
      enabled: true
      image: "gcr.io/gke-release/tpu_network_optimizer:tpu_network_optimizer_20250625.00_p0@sha256:0404b7f8ce86b25284a844ee4935c8927cd2572c1d6b07d1d2bd944f215fb80d"
    logCollector:
      enabled: true
      image: "gcr.io/gke-release/gke-distroless/bash:gke_distroless_20250807.00_p0@sha256:4de2c75a1f363c26c4f74bdd702d313410267c464a059b4fa32ac5d4cf10aba9"
    vbarControlAgent:
      enabled: true
      image: "gcr.io/gke-release/vbar_control_agent@sha256:631a35b6cc0638b3eed328ccea240199043dcfe4bed69c7cfc3d98752faa23fb"
