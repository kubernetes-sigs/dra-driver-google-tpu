# Default values for dra-driver-google-tpu.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

allowDefaultNamespace: false

deviceClasses: ["tpu"]

deviceClass:
  # extendedResourceName maps the tpu.google.com DeviceClass to a classic
  # extended resource name (KEP-5004), so pods can request TPUs via
  # `resources.limits` (e.g. `google.com/tpu`) instead of a ResourceClaim.
  # Defaults to "" (omitted) so a fresh install does not claim ownership of a
  # name that may collide with an existing device plugin advertising it. The
  # implicit name `deviceclass.resource.kubernetes.io/tpu.google.com` is always
  # available, whether or not an explicit name is set here. Requires the
  # DRAExtendedResource feature gate (beta and on by default since Kubernetes
  # 1.37; must be enabled explicitly on 1.35/1.36).
  extendedResourceName: ""

imagePullSecrets: []
image:
  repository: registry.k8s.io/dra-driver-google/dra-driver-google-tpu
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

controller:
  priorityClassName: "system-node-critical"
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  affinity: {}
  containers:
    controller:
      securityContext: {}
      resources: {}

kubeletPlugin:
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: cloud.google.com/gke-tpu-accelerator
            operator: Exists
          - key: cloud.google.com/gke-tpu-dra-driver
            operator: In
            values:
            - "true"
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  containers:
    init:
      securityContext: {}
      resources: {}
    plugin:
      securityContext:
        privileged: true
      resources: {}
