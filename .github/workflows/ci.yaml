name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  golang:
    uses: ./.github/workflows/golang.yaml
    with:
      golang_version: "1.26.0"

  helm:
    uses: ./.github/workflows/helm.yaml

  e2e:
    uses: ./.github/workflows/e2e.yaml
